[project]
name = "catalog-pipeline"
version = "0.1.0"
description = "Offline catalog enrichment pipeline for C06a (scripts/catalog)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
catalog-pipeline = "catalog_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
markers = [
    "db: needs a reachable PostgreSQL (Docker or JPV_PG*)",
]
