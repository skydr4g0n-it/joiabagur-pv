version: '3.8'

services:
  postgres:
    # pgvector-enabled PG 15 so extension `vector` is available for C05.
    # Image swap may require recreating the local volume:
    #   docker compose down -v
    # (destroys local DB data; acceptable for O0 / empty catalog).
    # Do NOT create schema `ai` or run CREATE EXTENSION here: that is the one-off
    # ai-service/migrations/bootstrap.sql, run once with admin privileges.
    image: pgvector/pgvector:pg15
    container_name: jpv-pv-postgres
    environment:
      POSTGRES_DB: joiabagur_pv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - jpv-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jpv-pv-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@joiabagur.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - jpv-network

  jbg-ai:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: jpv-pv-jbg-ai
    environment:
      APP_ENV: local
      SERVICE_VERSION: 0.1.0
      LOG_LEVEL: INFO
      # Local development placeholder only. Production reads it from SSM (C17)
      # and shares the same value with the .NET API, which signs the token.
      JWT_SECRET: local-dev-jwt-secret-0123456789abcdef
      STUB_MODE: "true"
      # Resolves `postgres` by network name on the INTERNAL port 5432, not the
      # 5433 published to the host. No depends_on: the engine is built on first
      # use, and under STUB_MODE nothing asks for a session — so the container
      # starts fine even against a database nobody has provisioned yet.
      # Provisioning is the one-off `ai-service/migrations/bootstrap.sql`.
      DATABASE_URL: postgresql+psycopg://jbg_ai:local-dev-ai-password@postgres:5432/joiabagur_pv
    ports:
      - "8001:8000"
    networks:
      - jpv-network

volumes:
  postgres_data:

networks:
  jpv-network:
    driver: bridge
