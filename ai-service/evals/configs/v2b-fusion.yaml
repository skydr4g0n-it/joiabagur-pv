# The two-stage fusion with the adaptive coverage rule, and NO business signals.
#
# This row exists so that a `v3` that improved would be attributable. Without it, an
# improvement could belong to the fusion or to the signals and nobody could say which.
#
# It runs UNSCOPED and with no reading scope, exactly like `v2-hibrido`, so the only
# difference between the two rows is how the ranked lists are composed. Its operational
# reading is therefore absent, and that is correct: this configuration reorders by no
# business signal, so it never competed on that metric.
id: v2b-fusion
kind: pipeline
label: "Fusión por rama con cobertura adaptativa"
rationale: >-
  La fusión en dos etapas con pesos por rama, más la ponderación adaptativa por cobertura.
  Aísla la corrección de la fusión: misma ventana de evaluación que v2-hibrido, sin señales
  de negocio. La fusión plana de v2 no fusiona sino que concatena — con los pesos de C21 los
  sesenta documentos léxicos ganan siempre al mejor acierto vectorial — y ésta es la fila que
  mide cuánto vale corregirlo.
uses_provider: true
mode: hybrid
expand_synonyms: true
fusion: branch
rrf_k: 60
branch_weight_lexical: 0.5
branch_weight_vector: 0.5
coverage_rule: continuous
branch_depth: 60
pos_prefilter: false
max_results: 60
