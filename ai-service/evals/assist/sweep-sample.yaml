# La muestra del barrido de contexto de C30b — declarada ANTES de medir nada.
#
# Vive fuera de `evals/configs/` a propósito: ese directorio lo recorre `load_all()` y un test
# afirma que su contenido es EXACTAMENTE la tabla de ablación de la recuperación. Este fichero
# no es una fila de esa tabla, así que meterlo allí rompería una afirmación cierta.
#
# ── Por qué hay muestra propia ─────────────────────────────────────────────────────────────
#
# El golden set de C24/C26 **no puede evaluar el argumentario**: son 72 consultas y NINGUNA
# ancla una pieza, o sea 100 % modo de consulta libre, que es justo el modo que C30b no
# genera. `source_product_id` sólo aparece en las 5 consultas de categoría `sustituto` de C26,
# y ancla una búsqueda de sustitutos, no una asistencia. El barrido es inherentemente del modo
# «pieza sin pregunta» —`pitch_sections` y `material_cap` sólo gobiernan `ground_piece`—, así
# que necesita población propia. **C38 hereda el mismo hueco** y queda anotado en su ficha.
#
# ── La medición que decide la estratificación ──────────────────────────────────────────────
#
# Tomada sobre el índice local el 2026-09-14, antes de elegir nada, sobre las piezas activas
# con embedding (`ai.product_document`, 1.168 filas):
#
#     materiales declarados │ piezas │  %
#     ──────────────────────┼────────┼───────
#                         0 │    122 │ 10,4 %
#                         1 │    955 │ 81,8 %
#                         2 │     90 │  7,7 %
#                         3 │      1 │  0,1 %
#
# Las piezas de **≥2 materiales son el 7,8 %**, y son exactamente las que arrastran la sección
# de piezas mixtas y por tanto donde vive el riesgo de atribución cruzada que `grounding.py`
# declara sin resolver. Una muestra proporcional traería una o dos y no mediría nada sobre
# ellas: de ahí que la muestra sea **estratificada a partes iguales** y no aleatoria.
#
# Las piezas de **0 materiales quedan fuera, y no por descuido**: `ground_piece` no les
# direcciona ningún fragmento, así que el número de secciones —que es el parámetro barrido— no
# puede cambiar nada en ellas. Serían filas que no pueden variar con lo que se está midiendo.
#
# ── Criterio de selección ──────────────────────────────────────────────────────────────────
#
# Determinista y reproducible: `ORDER BY md5(product_id::text) LIMIT 20` dentro de cada
# estrato. El orden por hash no está correlacionado con el orden de carga del catálogo, así
# que no agrupa por lote de importación, y da la misma muestra en cada ejecución sin necesidad
# de fijar una semilla. Los identificadores se **escriben aquí** en vez de re-derivarse al
# ejecutar: una muestra que se recalcula es una muestra que puede moverse entre dos arms.
#
# Tamaño: 20 + 20 = 40 piezas × 3 arms (1, 2 y 3 secciones) = **120 generaciones**. A ~1.500
# tokens de entrada y ~300 de salida con `gpt-4o-mini`, son ~0,05 USD el barrido entero. El
# coste no decide nada aquí y conviene decirlo por escrito.

id: c30b-assist-sweep
label: "Barrido de ancho de contexto del argumentario — 1, 2 y 3 secciones"
prompt_version: assist/v1
model: openai/gpt-4o-mini
measured_on: 2026-09-14
index:
  source: ai.product_document
  filter: is_active AND embedding IS NOT NULL
  active_with_embedding: 1168
  by_declared_materials: {0: 122, 1: 955, 2: 90, 3: 1}

selection:
  criterion: "ORDER BY md5(product_id::text) LIMIT 20 por estrato"
  per_stratum: 20
  excluded: "piezas de 0 materiales: ground_piece no les direcciona nada, el arm no puede moverlas"

# Los tres anchos de contexto. Los arms de 1 y 2 son prefijos de DEFAULT_PITCH_SECTIONS, así
# que el arm de 2 es literalmente la configuración que se sirve hoy. La tercera sección es
# `que-lo-estropea`: comprobado sobre el corpus, está presente y con `claim_scope: general` en
# las NUEVE fichas canónicas de material —las dos que no la tienen, `material-piezas-mixtas` y
# `material-marcajes-y-punzones`, no son fichas de material canónico—, que es la misma
# condición que C30a exigió a las dos primeras.
arms:
  - sections: 1
    section_slugs: [cuidados-y-limpieza-en-casa]
  - sections: 2
    section_slugs: [cuidados-y-limpieza-en-casa, piel-sensible-y-alergias]
  - sections: 3
    section_slugs: [cuidados-y-limpieza-en-casa, piel-sensible-y-alergias, que-lo-estropea]

