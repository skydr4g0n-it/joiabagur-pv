# Alembic configuration for the `ai` schema. Delivered by C05.
#
# There is deliberately no `sqlalchemy.url` here: the connection string is read
# from `DATABASE_URL` in env.py. Writing it in this file would put a credential
# under version control and would make the local and RDS paths diverge.

[alembic]
script_location = migrations
prepend_sys_path = .
# Split path options on the OS separator instead of the legacy "spaces, commas
# and colons" rule, which mangles Windows paths like C:\...
path_separator = os

# One driver for both callers: `postgresql+psycopg://` is sync for Alembic and
# async for the FastAPI app, so a single DATABASE_URL serves both (design §5).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
