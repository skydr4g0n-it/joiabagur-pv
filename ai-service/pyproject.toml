[project]
name = "jbg-ai"
version = "0.1.0"
description = "JoiaBagur jbg-ai FastAPI service (Proyecto Final RAG)"
readme = "README.md"
authors = [
    { name = "Sergio Valdueza Lozano", email = "SValduezaL@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "bcrypt>=4.2.0",
    "fastapi>=0.141.1",
    "litellm==1.98.0",
    "openai>=1.68.0",
    "pgvector>=0.3.6",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.9.0",
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.52.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "testcontainers[postgres]>=4.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` on the path makes `support/` importable from every subfolder.
pythonpath = ["src", "tests"]
# importlib keeps same-named test modules in different folders from colliding
# (e.g. retrieval/test_ranking.py and assist/test_ranking.py).
addopts = "--import-mode=importlib"
markers = [
    "db: needs a PostgreSQL instance with pgvector",
    "slow: evaluation sweeps and calibration runs",
]

