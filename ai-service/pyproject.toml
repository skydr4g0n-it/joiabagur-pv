[project]
name = "jbg-ai"
version = "0.1.0"
description = "JoiaBagur jbg-ai FastAPI skeleton (Proyecto Final RAG, C01)"
readme = "README.md"
authors = [
    { name = "Sergio Valdueza Lozano", email = "SValduezaL@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.9.0",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

