name: Terraform Apply (infra refresh)

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

env:
  AWS_REGION: eu-west-3

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          role-session-name: TerraformRefresh-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - run: terraform init

      - run: terraform apply -auto-approve
        env:
          TF_VAR_domain_name: pv.joiabagur.com
          TF_VAR_github_repo: skydr4g0n-it/joiabagur-pv
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
          TF_VAR_jwt_secret_key: ${{ secrets.TF_JWT_SECRET_KEY }}
          TF_VAR_ami_id: ${{ secrets.TF_AMI_ID }}
